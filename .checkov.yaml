# Checkov config used by CI. Every skip is a deliberate design decision (see CLAUDE.md)
# or a known false positive, with the reason next to it.
framework:
  - terraform
compact: true
quiet: true
skip-path:
  - .venv
  - dist
  - .terraform-plugin-cache
skip-check:
  # --- Cost: learning project, stack destroyed after every session ---
  - CKV2_AWS_11   # VPC flow logs (CloudWatch ingestion cost)
  - CKV_AWS_91    # NLB access logs
  - CKV_AWS_18    # S3 access logging
  - CKV_AWS_144   # S3 cross-region replication
  - CKV2_AWS_62   # S3 event notifications (nothing consumes them)
  - CKV_AWS_145   # S3 SSE-KMS: SSE-S3 is enough here and avoids a KMS key per bucket
  - CKV_AWS_119   # DynamoDB CMK: AWS-owned key is free and encrypts at rest
  - CKV_AWS_28    # DynamoDB PITR: table is recreated every session
  - CKV_AWS_150   # NLB deletion protection would block the nightly destroy
  - CKV_AWS_21    # Artifacts bucket versioning: releases/ are immutable <git-sha>.zip and expire after 30 days
  # --- Design decisions ---
  - CKV_AWS_88    # Instances need a public IP (no NAT Gateway); inbound is port 80 from the NLB SG only
  - CKV2_AWS_20   # NLB is TCP pass-through on port 80 for a demo app (no TLS certificate/domain)
  - CKV_AWS_111   # CodeDeploy role: ec2:RunInstances/CreateTags on * is required by AWS with launch templates
  - CKV_AWS_356   # Same CodeDeploy statement; plus iam:Get*/List* read-only on * for the deploy role
  - CKV_AWS_109   # KMS key policy grants kms:* to the account root: the standard AWS pattern that enables IAM policies
  # --- False positives ---
  - CKV2_AWS_5    # SGs are attached via module inputs (launch template / NLB); checkov cannot follow it
  - CKV_AWS_260   # Port-80 ingress references the NLB security group, not 0.0.0.0/0
