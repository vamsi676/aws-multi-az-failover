name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [app, infra, both]
        default: app
      allow_destroy:
        description: Allow a plan that destroys or replaces resources
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC token for the deploy role

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    name: deploy ${{ inputs.target }} to dev
    runs-on: ubuntu-latest
    environment: dev   # required reviewer approves before this job starts
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: AWS credentials (deploy role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      # ---------------- infra ----------------
      - uses: hashicorp/setup-terraform@v4
        if: inputs.target != 'app'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform plan
        if: inputs.target != 'app'
        working-directory: envs/dev
        env:
          TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
          TF_VAR_allowed_cidr: ${{ vars.ALLOWED_CIDR }}
          TF_VAR_artifacts_bucket_name: ${{ vars.ARTIFACTS_BUCKET }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -no-color -lock-timeout=120s -out=tfplan
          summary="$(terraform show -no-color tfplan | grep -E '^(Plan:|No changes)' | tail -1)"
          echo "### Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo "${summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against destroy/replace
        if: inputs.target != 'app'
        working-directory: envs/dev
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          deletes="$(terraform show -json tfplan \
            | jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length')"
          echo "Resources to delete or replace: ${deletes}"
          if [[ "$deletes" -gt 0 && "$ALLOW_DESTROY" != "true" ]]; then
            terraform show -json tfplan \
              | jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.change.actions|join("/")) \(.address)"'
            echo "::error::Plan destroys or replaces ${deletes} resource(s). Re-run with allow_destroy=true if intended."
            exit 1
          fi

      - name: terraform apply
        if: inputs.target != 'app'
        working-directory: envs/dev
        run: terraform apply -no-color -lock-timeout=120s tfplan

      # ---------------- app ----------------
      - uses: actions/setup-python@v7
        if: inputs.target != 'infra'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Build bundle
        if: inputs.target != 'infra'
        id: build
        run: echo "zip=$(scripts/build_app.sh "${GITHUB_SHA::7}" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: CodeDeploy deployment
        if: inputs.target != 'infra'
        env:
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          CODEDEPLOY_APP: ${{ vars.CODEDEPLOY_APP }}
          CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP }}
        run: |
          scripts/deploy_app.sh "${{ steps.build.outputs.zip }}" | tee deploy.txt
          echo "### App deploy" >> "$GITHUB_STEP_SUMMARY"
          tail -1 deploy.txt >> "$GITHUB_STEP_SUMMARY"
