version: 0.0
os: linux

# The whole bundle (taskboard/, vendor/, config/, codedeploy/, VERSION) goes to /opt/taskboard.
files:
  - source: /
    destination: /opt/taskboard
file_exists_behavior: OVERWRITE

# Every hook is idempotent and safe on a freshly launched instance.
hooks:
  ApplicationStop:
    - location: codedeploy/application_stop.sh
      timeout: 300
      runas: root
  BeforeInstall:
    - location: codedeploy/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: codedeploy/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: codedeploy/application_start.sh
      timeout: 300
      runas: root
  ValidateService:
    - location: codedeploy/validate_service.sh
      timeout: 300
      runas: root
